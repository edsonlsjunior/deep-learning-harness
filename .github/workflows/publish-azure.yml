name: Publicar laboratorio na Azure

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - run: az acr login --name ${{ vars.AZURE_ACR_NAME }}
      - run: |
          IMAGE="${{ vars.AZURE_ACR_LOGIN_SERVER }}/dl-harness:${{ github.sha }}"
          docker build --tag "$IMAGE" --tag "${{ vars.AZURE_ACR_LOGIN_SERVER }}/dl-harness:latest" .
          docker push "$IMAGE"
          docker push "${{ vars.AZURE_ACR_LOGIN_SERVER }}/dl-harness:latest"
      - run: |
          az webapp config container set \
            --name "${{ vars.AZURE_WEBAPP_NAME }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --docker-custom-image-name "${{ vars.AZURE_ACR_LOGIN_SERVER }}/dl-harness:${{ github.sha }}" \
            --docker-registry-server-url "https://${{ vars.AZURE_ACR_LOGIN_SERVER }}"
          az webapp restart --name "${{ vars.AZURE_WEBAPP_NAME }}" --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}"
